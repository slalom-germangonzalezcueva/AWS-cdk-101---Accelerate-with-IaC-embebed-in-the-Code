name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    # if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.head.repo.fork == false)
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.0.0
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4.0.2
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install dependencies
        run: pnpm run install:all

      - name: Build
        run: pnpm run build

      - name: Synthesize CDK
        run: pnpm run synth

      - name: Diff CDK
        run: pnpm run diff

      - name: Deploy and capture outputs
        run: pnpm run deploy | tee deploy.log

      - name: Append CDK outputs to summary
        run: |
          echo '### CDK Outputs' >> $GITHUB_STEP_SUMMARY
          awk '/Outputs:/,0' deploy.log >> $GITHUB_STEP_SUMMARY
